<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Functions in JS</title>
</head>
<body>
    <script>
        //function- Functions in JavaScript are 
        // reusable blocks of code designed to perform a specific task.

        //normal parameters
        //without parameters
        function demo() {
            console.log("hello JS");
        }
        demo();  //function calling

        //with parameters
        function demo1(text) {
            console.log("hello " + text);
        }
        demo1("react");  //react is arguemnent text is parameter

        //with default parameters
        function cal(a,b=13) {
            console.log("addition of two numbers is " + (a+b));
        }
        demo1("react");
        cal(12);  // ek arguement ko default lena hai change sirf dusre arguement ko karna hai 
        demo();    // JS mei function ko call karne ka order synchronized hota hai order wise output aata hai 
         
        //anaonymous function - An anonymous function in JavaScript is a function 
        // that does not have an identifier (name) associated with it.

        let msg=function() {
            console.log("hello Advanced JS");
        };
        msg();
        //short code for above function i.e arrow function
        let msg1=()=>console.log("hello function as an arrow");
        msg1();

        //arrow function using multi lines

        let add=(a,b)=>{
            console.log("first number is "+ a);
            console.log("second number is " +b);
            console.log("addition of two number is " + (a+b));
        }
        add(4,5);

        //IIFE-Immediately Invoked Function Expressions (IIFEs): 
        // An anonymous function can be defined and executed immediately to create a private scope
        //  for variables, preventing them from polluting the global namespace.
        //it runs as soon as it is defined 

        (function() {
            console.log("IIFE in JS ");
        })();

        ///IIFE using arrow 
        (()=> console.log("IIFE using arrow"))();

        //callback function : A callback function in JavaScript is a function passed as an argument to another function, which is then executed (or "called back") 
        // at a later point in time to complete a specific task.

        function mul(callback) {
            var num1= 3;
            console.log("first number is " + num1);
            var num2= 7;
            console.log("second number is " + num2);
            var res= num1* num2;
            callback(res);
        }

        function result(res){
            console.log("multiplication is " + res);
        }
        mul(result);

        //with parameters
        // callback function using setTimeout API
        function msg2() {
            console.log("hello call back");
            document.writeln("hello");

        }

        function loading () {
            document.writeln("loading...........")
        };
        setTimeout(msg2, 2000);
        loading();

        //map filter and reduce : In JavaScript, map(), filter(), and reduce() are powerful, built-in array methods that allow for
        //  data processing using functional programming principle
        //map: purpose-Transform each element in an array. return - A new array of the same length with the transformed elements.
        //filter: purpose-Selectively include elements that pass a test condition. return - A new array containing only the elements that met the condition.
        // reduce: purpose: Aggregate all elements in an array into a single value. return : A single value (which can be a number, string, object, or another array).


        let num= [3, 4, 5 , 7];
        let finalResult=num.map(n=>n*2);
        console.log(finalResult);

        //filter method

        let finalResult1=num.filter(n=>n>3);
        console.log(finalResult1);

        //reduce method

        let finalResult2= num.reduce((total,n) => total+ n);
        console.log(finalResult2);
        
        //Promises :  JavaScript Promise is an object representing the eventual outcome (completion or failure) of an asynchronous operation. It acts as a placeholder for a value that is not yet available,
        //  enabling cleaner and more readable asynchronous code than traditional callbacks. 

        let promise= new Promise(function(resolve, reject){
            let age = 5;
            if (age>=18) {
                resolve("valid age");
            }

            else {
                reject("wait for next year");
            }
        });

        //calling promise 
        promise.then(result=>console.log(result)). 
        catch(error=>console.log(error)).
        finally(msg=>console.log("done"));



        //promises stages
        //1. Pending: The initial state. The asynchronous operation is still in progress and has not yet completed or failed. 
        // The promise's result is undefined during this stage.

        //async await.... ==> async and await are modern JavaScript keywords that allow developers to write asynchronous code in a clean, synchronous-like style,
        //  making it easier to read and maintain than traditional promise chaining with .then().

        //json ==>  JSON (JavaScript Object Notation) is a lightweight, text-based data interchange format derived from JavaScript object syntax, but is language-independent and used across many programming languages. In JavaScript, the built-in JSON object provides methods 
        // to convert between JSON text and native JavaScript objects

        async function userData() { 
            try{
      let data = await fetch ('https://dummyjson.com/products?limit=10&skip=10&select=title,price');
      let updatedData= await data.json();
      console.log(updatedData);
            } 

            catch(error) {
                console.log("Not fetched " + error);
            }
        }
        userData();
          
        //local storage- 



        let userInfo={
            name: "Shambhavi",
            age: 19,
            mob: 638468983,
            eMail: "shjubufu@gmail.com"
        }
        // convert Json object to string
        localStorage.setItem('preferences',  JSON.stringify(userInfo));
       //Retrieve the string and parse it back into an object
        let storagePreference=JSON.parse(localStorage.getItem
        ('prefrences'));
        console.log(storagePreference.name);
        



        




    </script>
    
</body>
</html>
