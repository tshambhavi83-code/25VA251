<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TechStore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{background:#f4f4f4;font-family:Arial}
.card{border:none;border-radius:10px;transition:.3s}
.card:hover{transform:translateY(-5px)}
.card img{height:220px;object-fit:cover}
footer{background:#212529;color:#fff;text-align:center;padding:15px;margin-top:40px}
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
<div class="container">
<a class="navbar-brand fw-bold" href="#">TechStore</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="nav">
<ul class="navbar-nav ms-auto">
<li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
<li class="nav-item"><a class="nav-link" href="#">Products</a></li>
<li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
</ul>
</div>
</div>
</nav>

<div class="container my-5">

<h2 class="text-center mb-4">Our Products</h2>

<div class="row g-4">

<div class="col-md-4">
<div class="card shadow h-100">
<img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=1000&auto=format&fit=crop" class="card-img-top">
<div class="card-body">
<h5>Smartphone <span class="badge bg-success">New</span></h5>
<p>Latest 5G smartphone.</p>
<button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#m">View Details</button>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card shadow h-100">
<img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?q=80&w=1000&auto=format&fit=crop" class="card-img-top">
<div class="card-body">
<h5>Headphones <span class="badge bg-danger">Sale</span></h5>
<p>Wireless premium headphones.</p>
<button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#m">View Details</button>
</div>
</div>
</div>

<div class="col-md-4">
<div class="card shadow h-100">
<img src="https://images.pexels.com/photos/18105/pexels-photo.jpg" class="card-img-top">
<div class="card-body">
<h5>Laptop <span class="badge bg-warning text-dark">Hot</span></h5>
<p>Best laptop for coding & gaming.</p>
<button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#m">View Details</button>
</div>
</div>
</div>

</div>
</div>

<div class="modal fade" id="m">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5 class="modal-title">Product Details</h5>
<button class="btn-close" data-bs-dismiss="modal"></button>
</div>
<div class="modal-body">Premium quality product with latest features.</div>
</div>
</div>
</div>

<footer>© 2026 TechStore | All Rights Reserved</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
